services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sou
      POSTGRES_USER: sou
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sou -d sou"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgresql://sou:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}@postgres:5432/sou
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:?Configure META_VERIFY_TOKEN no arquivo .env}
      META_APP_SECRET: ${META_APP_SECRET:?Configure META_APP_SECRET no arquivo .env}
      META_REQUIRE_SIGNATURE: ${META_REQUIRE_SIGNATURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-}
      LLM_HTTP_REFERER: ${LLM_HTTP_REFERER:-}
      LLM_APP_TITLE: ${LLM_APP_TITLE:-}
      LLM_FAILURE_MESSAGE: ${LLM_FAILURE_MESSAGE:-}
      LLM_FAILURE_ACTION: ${LLM_FAILURE_ACTION:-}
      LLM_SUPPORTS_TOOLS: ${LLM_SUPPORTS_TOOLS:-}
      WHATSAPP_CHANNEL_ENABLED: ${WHATSAPP_CHANNEL_ENABLED:-false}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-unofficial_qr}
      WHATSAPP_SESSION_DIR: /data/whatsapp/sessions
      WHATSAPP_STATE_DIR: /data/whatsapp/state
      WHATSAPP_ALERT_WEBHOOK_URL: ${WHATSAPP_ALERT_WEBHOOK_URL:-}
      WHATSAPP_PANEL_ORIGINS: ${WHATSAPP_PANEL_ORIGINS:-}
      WHATSAPP_META_PHONE_NUMBER_ID: ${WHATSAPP_META_PHONE_NUMBER_ID:-}
      WHATSAPP_META_ACCESS_TOKEN: ${WHATSAPP_META_ACCESS_TOKEN:-}
      WHATSAPP_PROACTIVE_ENABLED: ${WHATSAPP_PROACTIVE_ENABLED:-false}
      WHATSAPP_DAILY_CAP: ${WHATSAPP_DAILY_CAP:-}
      WHATSAPP_MESSAGES_PER_MINUTE: ${WHATSAPP_MESSAGES_PER_MINUTE:-}
      WHATSAPP_MESSAGES_PER_HOUR: ${WHATSAPP_MESSAGES_PER_HOUR:-}
      WHATSAPP_MIN_DELAY_MS: ${WHATSAPP_MIN_DELAY_MS:-}
      WHATSAPP_MAX_DELAY_MS: ${WHATSAPP_MAX_DELAY_MS:-}
      WHATSAPP_FIRST_MESSAGE_DELAY_MS: ${WHATSAPP_FIRST_MESSAGE_DELAY_MS:-}
      WHATSAPP_WARMUP_DAYS: ${WHATSAPP_WARMUP_DAYS:-7}
      WHATSAPP_QUIET_START: ${WHATSAPP_QUIET_START:-21}
      WHATSAPP_QUIET_END: ${WHATSAPP_QUIET_END:-8}
      WHATSAPP_TIME_ZONE: ${WHATSAPP_TIME_ZONE:-America/Sao_Paulo}
      WHATSAPP_MAX_LINKS: ${WHATSAPP_MAX_LINKS:-1}
    volumes:
      - whatsapp-data:/data/whatsapp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - api
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  postgres-data:
  whatsapp-data:
  caddy-data:
  caddy-config:

